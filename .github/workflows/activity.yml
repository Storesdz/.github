name: Public activity chart

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/activity.yml']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/activity.yml']

permissions:
  contents: read

concurrency:
  group: activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/activity.test.mjs
      - name: Refresh public activity
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/activity.mjs
      - name: Save chart
        if: github.event_name != 'pull_request'
        run: |
          git add profile/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public activity chart'
          git push
